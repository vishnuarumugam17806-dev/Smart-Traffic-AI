    <!-- Automatic Multi-Device Screen Scaling Engine -->
    <script>
      (function() {
        function autoScaleDeviceScreen() {
          var vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          var vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

          // Safe mobile viewport height units
          document.documentElement.style.setProperty('--vh', (vh * 0.01) + 'px');
          document.documentElement.style.setProperty('--vw', (vw * 0.01) + 'px');

          // Calculate device scale factor normalized across screens & DPI scaling
          var scaleFactor = 1;
          if (vw >= 1920) {
            scaleFactor = Math.min(vw / 1920, 1.35);
          } else if (vw >= 1280) {
            scaleFactor = Math.max(vw / 1440, 0.88);
          } else if (vw >= 768) {
            scaleFactor = Math.max(vw / 1024, 0.85);
          } else {
            scaleFactor = Math.max(vw / 390, 0.85);
          }

          document.documentElement.style.setProperty('--app-scale', scaleFactor.toFixed(3));
          
          // Proportional root font-size scaling
          var computedRem = Math.min(Math.max(15 * scaleFactor, 13), 19);
          document.documentElement.style.fontSize = computedRem.toFixed(2) + 'px';
        }

        autoScaleDeviceScreen();
        window.addEventListener('resize', autoScaleDeviceScreen, { passive: true });
        window.addEventListener('orientationchange', autoScaleDeviceScreen, { passive: true });
        document.addEventListener('DOMContentLoaded', autoScaleDeviceScreen);
      })();
    </script>
