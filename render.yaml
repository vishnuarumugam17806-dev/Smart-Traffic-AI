services:
  # 1. FastAPI + YOLOv8 Backend Docker Container
  - type: web
    name: vigitra-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: vigitra_db
      - key: FRONTEND_BASE_URL
        value: https://vigitra-frontend.onrender.com

  # 2. React Vite Frontend Static SPA Service
  - type: web
    name: vigitra-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vigitra-backend.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://vigitra-backend.onrender.com/ws/traffic
      - key: VITE_FRONTEND_BASE_URL
        value: https://vigitra-frontend.onrender.com


