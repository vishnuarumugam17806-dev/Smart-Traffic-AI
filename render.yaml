services:
  # 1. Primary FastAPI + YOLOv8 Backend Docker Service
  - type: web
    name: vigitra-backend
    autoDeploy: true
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: FRONTEND_BASE_URL
        value: https://vigitra-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: vigitra_db

  # 2. Secondary/Replica FastAPI Backend Service (vigitra-backendk0yj)
  - type: web
    name: vigitra-backendk0yj
    autoDeploy: true
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: FRONTEND_BASE_URL
        value: https://vigitra-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: vigitra_db

  # 3. Hyphenated Variant FastAPI Backend Service (vigitra-backend-k0yj)
  - type: web
    name: vigitra-backend-k0yj
    autoDeploy: true
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: FRONTEND_BASE_URL
        value: https://vigitra-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: vigitra_db

  # 4. React Vite Frontend Static SPA Service
  - type: web
    name: vigitra-frontend
    autoDeploy: true
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vigitra-backend.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://vigitra-backend.onrender.com/ws/traffic
      - key: VITE_FRONTEND_BASE_URL
        value: https://vigitra-frontend.onrender.com
